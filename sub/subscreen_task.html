<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../global.css">
</head>
<body>
<div class="phone">
  <div class="sbar"><span>9:41</span><span>⚡ 100%</span></div>
  <div class="scr" style="padding-top:10px;">
    <div class="topbar">
      <button class="tbadge" onclick="window.location.href='../index.html'">←</button>
      <div></div>
    </div>
    
    <div class="task-scroll" id="task-list"></div>
  </div>
</div>

<script src="../script.js"></script>
<script>
  function renderTasks() {
    const list = document.getElementById('task-list');
    const active = S.tasks.filter(t => !t.done);
    if(!active.length) { list.innerHTML = '<p style="text-align:center; font-weight:800; color:var(--text-muted); padding-top:40px;">Semua tugas beres!</p>'; return; }
    
    list.innerHTML = active.map(t => `
      <div style="background:#fff; padding:16px; border-radius:20px; border:2px solid var(--border-light); border-bottom-width:6px; margin-bottom:12px; width:100%; position:relative;">
        <h3 style="font-size:16px; color:var(--text-main); font-weight:900;">• ${t.text} 📤</h3>
        <p style="font-size:13px; font-weight:800; color:var(--duo-pink); margin:6px 0;">Due: ${t.date}</p>
        ${t.info ? `<ul style="padding-left:20px; color:var(--text-muted); font-size:14px; font-weight:800; line-height:1.6; margin-bottom:15px;">${t.info.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
        
        <button onclick="triggerCamera(${t.id})" style="position:absolute; bottom:16px; right:16px; background:var(--duo-brown); border:2px solid var(--duo-brown-shadow); border-bottom-width:4px; color:white; border-radius:12px; padding:6px 14px; font-weight:900; cursor:pointer; transition:0.1s;">Submit 📤</button>
      </div>
    `).join('');
  }
  document.addEventListener('DOMContentLoaded', renderTasks);
</script>
</body>
</html>
