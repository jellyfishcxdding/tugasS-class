<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Semua To-Do List</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../global.css">
</head>
<body>
<div class="phone">
  <div class="sbar"><span>9:41</span><span style="font-size:10px; font-weight:900;">TODOPLANT</span><span>⚡ 100%</span></div>
  <div class="scr" style="padding-top:10px;">
    <div class="topbar">
      <button class="tbadge" style="border:none;" onclick="window.location.href='../index.html'">← Kembali</button>
      <h3 style="color:var(--text); font-size:15px; font-weight:900;">Semua To-Do List</h3>
      <div style="width:60px;"></div>
    </div>
    <div class="task-scroll" id="task-list"></div>
    <button class="btn-add-main" onclick="goTo('subscreen_creatingTodo.html')">+ Tambah Tugas Baru</button>
  </div>
</div>
<script src="../script.js"></script>
<script>
  function renderTasks() {
    const list = document.getElementById('task-list');
    if (!S.tasks.length) { list.innerHTML = `<p style="text-align:center; padding:30px 0; color:var(--muted); font-weight:800;">Tidak ada tugas.</p>`; return; }
    list.innerHTML = S.tasks.map(t => `
      <div class="t-item ${t.done ? 'done' : ''}" onclick="triggerCamera(${t.id})">
        <div class="t-check"></div>
        <div style="flex:1;">
           <div class="t-text">${t.text}</div>
           <div style="font-size:11px; color:var(--muted); font-weight:800; margin-top:4px;">Batas: ${t.date}</div>
        </div>
      </div>
    `).join('');
  }
  document.addEventListener('DOMContentLoaded', () => { syncGlobalStats(); renderTasks(); });
</script>
</body>
</html>
