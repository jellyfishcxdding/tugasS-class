<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../global.css">
</head>
<body>
<div class="phone">
  <div class="sbar"><span>9:41</span><span>⚡ 100%</span></div>
  <div class="scr" style="padding-top:10px;">
    
    <div class="topbar">
      <button class="tbadge" onclick="window.location.href='../mainScreen.html'">←</button>
      <div></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; margin: 20px 0 40px;">
      <div class="anim-coin" style="font-size: 80px; margin-bottom: 16px;">🪙</div>
      <div style="font-size: 26px; font-weight: 900; color: var(--text-main);">
        <span id="coin-amt"></span> coins
      </div>
    </div>

    <div class="task-scroll" id="history-list"></div>

  </div>
</div>
<script src="../script.js"></script>
<script>
  document.getElementById('coin-amt').textContent = S.coins;

  function renderHistory() {
    const list = document.getElementById('history-list');
    const doneTasks = S.tasks.filter(t => t.done === true);
    
    if (!doneTasks.length) {
      list.innerHTML = `<p style="text-align:center; font-weight:800; color:var(--text-muted);">Belum ada tugas kelar.</p>`;
      return;
    }

    list.innerHTML = doneTasks.map(t => `
      <div style="background:#fff; padding:16px; border-radius:16px; border:2px solid var(--border-light); border-bottom-width:4px; margin-bottom:12px;">
        <div style="font-size:12px; font-weight:800; color:var(--text-muted);">Task completed</div>
        <div style="display:flex; justify-content:space-between; margin-top:8px;">
          <div style="font-size:14px; font-weight:900; color:var(--text-main);">${t.text}</div>
          <div style="font-size:13px; font-weight:900; color:var(--duo-blue);">+20 🪙</div>
        </div>
      </div>
    `).join('');
  }
  document.addEventListener('DOMContentLoaded', renderHistory);
</script>
</body>
</html>
